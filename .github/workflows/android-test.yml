name: Android test app

# Builds an installable test version of the app for Android phones whenever the
# mobile branch changes (or on demand from the Actions tab), and publishes it as
# a pre-release on the project's Releases page.
on:
  push:
    branches: [mobile]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-test
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Capacitor
        run: npm ci
      - name: Copy the web app into the phone project
        run: npm run build && npx cap sync android
      - name: Use the test signing key (so updates install over earlier test builds)
        run: mkdir -p ~/.android && cp android/test-signing/debug.keystore ~/.android/debug.keystore
      - name: Build the Android app
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "LotteryEngine-test-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: LotteryEngine-test-${{ github.run_number }}
          path: mobile/LotteryEngine-test-${{ github.run_number }}.apk
      - name: Publish as a test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-test-${{ github.run_number }}" "LotteryEngine-test-${{ github.run_number }}.apk" \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "Android test build ${{ github.run_number }}" \
            --notes "Test version of the Lottery Intelligence Engine for Android phones. Not for distribution. Built from the mobile branch, commit ${{ github.sha }}."
