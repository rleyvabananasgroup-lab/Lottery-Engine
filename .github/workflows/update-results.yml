name: Update lottery results

# Runs four times a day (times are UTC), covering the morning after every
# Powerball (Mon/Wed/Sat) and Mega Millions (Tue/Fri) drawing, plus a manual
# "Run workflow" button on the Actions tab.
on:
  schedule:
    - cron: '20 5,9,13,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download and check new results
        run: node scripts/update-results.mjs
      - name: Save new results
        run: |
          if git diff --quiet -- data/feed.json; then
            echo "No new results."
          else
            git config user.name "lie-results-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/feed.json
            git commit -m "Results update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
