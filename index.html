<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lottery Intelligence Engine</title>
<meta name="description" content="Five-ticket Powerball and Mega Millions research engine">
<meta name="theme-color" content="#101A2A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LIE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  color-scheme: dark;
  --bg:#101A2A; --bg2:#0C1522; --panel:#18253A; --panel2:#1E2E47; --line:#2A3C59;
  --text:#EAF0F8; --muted:#97A7C0; --faint:#6E809C;
  --ivory:#F7F2E6; --ivory-edge:#D9D0BC; --ink:#18202E;
  --pb:#E5484D; --mm:#E8B647; --good:#46C28A; --warn:#E8B647; --bad:#EF6B6B;
  --accent:var(--pb); --accent-ink:#fff;
  --display:'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --body:'Barlow', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#EEF2F7; --bg2:#E3E9F1; --panel:#FFFFFF; --panel2:#F3F6FA; --line:#CCD6E3;
  --text:#142033; --muted:#4F6079; --faint:#73839B; --ivory:#FFFFFF; --ivory-edge:#C9CFD8;
}
:root[data-theme="dark"]{ color-scheme: dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body[data-game="mm"]{--accent:var(--mm);--accent-ink:#1A1405}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg2);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand-mark{width:34px;height:34px;border-radius:50%;background:var(--ivory);color:var(--ink);display:grid;place-items:center;font:700 15px var(--display);box-shadow:inset -3px -4px 0 var(--ivory-edge)}
.brand-name{font:600 19px/1.1 var(--display);letter-spacing:.01em}
.brand-name small{display:block;font:500 12px var(--body);color:var(--muted);letter-spacing:0}
.switch{margin-left:auto;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.switch button{border:0;background:none;padding:7px 14px;border-radius:999px;font:600 16px var(--display);letter-spacing:.02em;cursor:pointer;color:var(--muted)}
.switch button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0}
h1{font-size:clamp(28px,6vw,40px)} h2{font-size:24px} h3{font-size:19px}
p{margin:.4em 0} .muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:14px}
.section{margin-top:22px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel + .panel{margin-top:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.balls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ball{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;background:var(--ivory);color:var(--ink);font:700 18px var(--display);box-shadow:inset -2px -3px 0 var(--ivory-edge);font-variant-numeric:tabular-nums}
.ball.sp{background:var(--accent);color:var(--accent-ink);box-shadow:inset -2px -3px 0 rgba(0,0,0,.18)}
.ball.hit{outline:3px solid var(--good);outline-offset:1px}
.ball.sm{width:28px;height:28px;font-size:15px}
.ball.lg{width:52px;height:52px;font-size:27px}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.quiet{background:none}
.btn:disabled{opacity:.5;cursor:default}
.go{display:block;width:100%;border:0;border-radius:16px;padding:22px 16px;background:var(--accent);color:var(--accent-ink);font:700 clamp(26px,6vw,34px)/1 var(--display);letter-spacing:.03em;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.28)}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.28)}
.go small{display:block;font:500 14px var(--body);letter-spacing:0;margin-top:6px;opacity:.85}
.hero{display:grid;gap:14px;margin-top:18px}
.drawcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
.drawcard .when{font:600 clamp(24px,5.5vw,32px)/1.1 var(--display)}
.latest{padding:10px 0;border-top:1px solid var(--line)}
.latest.first{border-top:0;padding-top:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.status{display:inline-flex;align-items:center;gap:7px;font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:18px}
.menu button{display:block;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.menu button b{display:block;font:600 18px var(--display)}
.menu button span{font-size:13px;color:var(--muted)}
.menu .adv{background:transparent}
.ticket{display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.ticket:first-child{border-top:0}
.ticket .lbl{font:600 15px var(--display);color:var(--muted);min-width:96px}
.ticket .lbl b{display:block;color:var(--text);font-size:19px}
.grade{font:700 26px/1 var(--display);width:44px;height:44px;border-radius:10px;display:grid;place-items:center;border:2px solid var(--line)}
.grade.A{border-color:var(--good);color:var(--good)} .grade.B{border-color:#7DC9A6;color:#7DC9A6} .grade.D,.grade.F{color:var(--muted)}
details{margin-top:6px} summary{cursor:pointer;color:var(--muted);font-size:14px}
details ul{margin:6px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;color:var(--muted)}
.chip.acc{border-color:var(--accent);color:var(--text)}
.note{border-left:3px solid var(--accent);padding:8px 12px;background:var(--panel2);border-radius:0 10px 10px 0;font-size:14px;color:var(--muted)}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
input[type=number],input[type=text],input[type=date],select{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.nums input{width:56px;text-align:center;padding:8px 4px}
.opts label{display:flex;gap:8px;align-items:center;color:var(--text);margin:6px 0;font-size:15px}
.progress{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .15s}
.back{background:none;border:0;color:var(--muted);cursor:pointer;padding:12px 0 4px;font-size:15px}
.big{font:700 32px/1 var(--display)}
.stat{background:var(--panel2);border-radius:10px;padding:10px 12px}
.stat b{display:block;font:600 24px/1.1 var(--display)}
.stat span{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.chartbox{position:relative;height:260px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:30;max-width:90vw}
.overlay{position:fixed;inset:0;z-index:40;background:var(--bg2);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.shot{max-width:560px;margin:0 auto}
.shot .t{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.shot .t .n{font:600 16px var(--display);color:var(--muted);width:22px}
.shot h2{font-size:30px}
.modal{position:fixed;inset:0;z-index:35;background:rgba(5,10,18,.6);display:grid;place-items:end center;padding:0}
.modal .sheet{background:var(--panel);width:min(680px,100%);max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.modal{place-items:center}.modal .sheet{border-radius:16px}}
.hidden{display:none!important}
@media print{
  body *{visibility:hidden} .overlay,.overlay *{visibility:visible}
  .overlay{position:absolute;inset:0;background:#fff;color:#000} .noprint{display:none!important}
  .ball{box-shadow:none;border:1.5px solid #000;background:#fff;color:#000} .ball.sp{background:#000;color:#fff}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:520px){.ticket{grid-template-columns:1fr auto}.ticket .lbl{grid-column:1/-1}.ball{width:32px;height:32px;font-size:17px}}
</style>
</head>

    <button data-game="pb" aria-pressed="true">POWERBALL</button><button data-game="mm" aria-pressed="false">MEGA MILLIONS</button>
  </div>
</div></header>
<main class="wrap" id="app"></main>

// ------------------------------------------------------------ live updates
let netState = { pb: 'idle', mm: 'idle' };
async function fetchText(url, ms = 12000) {

// Results published to the app's shared feed (written by Claude on request) — the only data path

const FEED = { db: null, pb: null, mm: null, state: inClaude ? 'connecting' : 'none' };
function subscribeFeed(db) {
  for (const g of ['pb', 'mm']) db.doc('feed/' + g).onSnapshot(snap => {
    FEED[g] = snap.exists ? snap.data() : null; FEED.state = 'ok';
    if (FEED[g]) applyFeed(g); else render();
  }, () => { FEED.state = 'error'; render(); });
}
function applyFeed(g) {
  const f = FEED[g]; if (!f || typeof f.rows !== 'string') { render(); return { added: 0 }; }
  const src = f.source || 'Claude update';
  const recs = f.rows ? L.parseSnapshot(f.rows, g, src) : [];
  return applyIncoming(g, recs, src, f.updated || null);
}
function applyIncoming(g, incoming, source, when) {
  const m = S.meta[g]; const all = draws(g); const expected = L.latestExpectedDraw(g);
  const res = L.mergeDraws(g, all.map(r => ({ ...r })), incoming);
  let dirty = false;
  for (const r of res.added) { S.live[g].push(r); dirty = true; audit('data', `${G[g].name} ${r.d} added from ${source}: ${r.w.join('-')} + ${r.b}${r.m ? ' (×' + r.m + ')' : ''}.`); }
  for (const c of res.conflicts) {
    if (!S.conflicts.some(x => x.game === g && x.date === c.date)) {
      dirty = true;
      S.conflicts.push({ game: g, date: c.date, existing: c.existing, incoming: c.incoming, source, t: new Date().toISOString() });
      audit('conflict', `${G[g].name} ${c.date}: ${source} reports ${c.incoming.w.join('-')} + ${c.incoming.b}, stored record is ${c.existing.w.join('-')} + ${c.existing.b}. Stored record kept; review in Data status.`);
    }
  }
  // record late-published fields (e.g. Power Play) without touching the numbers
  for (const r of incoming) {
    if (!r) continue; const ex = S.live[g].find(x => x.d === r.d);
    if (ex) { if (ex.m == null && r.m != null) { ex.m = r.m; dirty = true; } if (!ex.dp && r.dp) { ex.dp = r.dp; dirty = true; } }
    else if (r.m != null || r.dp) {
      const b = base[g].find(x => x.d === r.d && x.w.join() === r.w.join() && x.b === r.b);
      if (b && ((b.m == null && r.m != null) || (!b.dp && r.dp))) { S.live[g].push({ ...b, m: b.m ?? r.m, dp: b.dp || r.dp, src: b.src + ' + ' + source }); dirty = true; }
    }

  for (const x of res.invalid) { dirty = true; audit('rejected', `${G[g].name} record ${x.rec.d} from ${source} rejected: ${x.errs.join(', ')}.`); }
  const stamp = when || new Date().toISOString();
  if (m.lastSuccess !== stamp || m.lastSource !== source) { m.lastSuccess = stamp; m.lastSource = source; dirty = true; }
  m.lastError = null;
  invalidate(g);
  const latest = draws(g)[draws(g).length - 1].d;
  m.status = latest >= expected ? 'current' : 'waiting';
  netState[g] = m.status;
  if (res.added.length) { checkAllTickets(); toast(`${res.added.length} new ${G[g].name} result${res.added.length > 1 ? 's' : ''} added. Tickets checked.`); }

}
async function refresh(g, force) {
  const m = S.meta[g];

    if (!FEED.db) { if (FEED.state === 'none') { netState[g] = 'offline'; m.status = 'offline'; } return { added: 0, nofeed: true }; }
    if (!force) return { added: 0 }; // the live subscription already keeps the feed current
    netState[g] = 'checking'; render();
    try { const snap = await FEED.db.doc('feed/' + g).get(); FEED[g] = snap.exists ? snap.data() : null; }
    catch (e) { netState[g] = 'offline'; render(); return { error: 'Couldn’t read the results feed.' }; }
    m.lastCheck = new Date().toISOString();
    const r = FEED[g] ? applyFeed(g) : { added: 0 };
    if (!FEED[g]) { netState[g] = 'waiting'; render(); }
    return r;
  }
  // Installed app / regular web address. 1) the results file the scheduled job keeps current,
  // 2) New York's open-data feed directly, 3) the public archive that mirrors it.
  let all = draws(g); let last = all[all.length - 1].d; const expected = L.latestExpectedDraw(g);
  m.lastCheck = new Date().toISOString();

  netState[g] = 'checking'; render();
  let fileAdded = 0;
  try {
    const f = JSON.parse(await fetchText('data/feed.json', 8000));
    if (f && f[g] && typeof f[g].rows === 'string') {
      FEED[g] = f[g];
      const r = applyIncoming(g, f[g].rows ? L.parseSnapshot(f[g].rows, g, f[g].source || 'results file') : [], f[g].source || 'results file', f[g].updated || null);
      fileAdded = r.added; all = draws(g); last = all[all.length - 1].d;

    }
  } catch (e) { /* no results file at this address; fall through to the live sources */ }
  let incoming = null, source = null, errors = [];
  try {
    const where = encodeURIComponent(`draw_date > '${L.addDays(last, -14)}T00:00:00.000'`);
    const txt = await fetchText(`https://data.ny.gov/resource/${G[g].ny}.json?$where=${where}&$order=draw_date%20ASC&$limit=200`);
    incoming = JSON.parse(txt).map(r => L.fromNYRow(g, r)); source = `NY Open Data ${G[g].ny}`;
  } catch (e) { errors.push('NY Open Data: ' + (e.name === 'AbortError' ? 'timed out' : e.message || 'blocked')); }
  if (!incoming) {
    try {
      const txt = await fetchText(`https://raw.githubusercontent.com/cruiseliner/lottery-master-archive/HEAD/data/${G[g].mirror}/draws.csv`);
      incoming = L.fromMirrorCSV(g, txt).filter(r => r.d > L.addDays(last, -14)); source = 'Lottery Master Archive (mirror of NY Open Data)';
    } catch (e) { errors.push('Archive mirror: ' + (e.name === 'AbortError' ? 'timed out' : e.message || 'blocked')); }
  }

  const all = draws(g), last = all[all.length - 1], expected = L.latestExpectedDraw(g), m = S.meta[g];
  const behind = last.d < expected;
  let dot = behind ? 'warn' : 'ok', text;
  if (netState[g] === 'checking') { dot = 'warn'; text = 'Checking for new results…'; }

  else if (netState[g] === 'offline' || m.status === 'offline') { dot = 'bad'; text = `Live update unavailable; data runs through ${fmtDate(last.d)} (${fmtDate(expected)} expected)`; }

    genState.progress = p; const bar = $('#genBar'); if (bar) bar.style.width = (p * 100).toFixed(0) + '%';
    const lbl = $('#genCount'); if (lbl) lbl.textContent = Math.round(p * S.settings.count).toLocaleString() + ' evaluated';

  const run = { id: uid(), game: g, created: new Date().toISOString(), target, version: v.id, weights: { ...v.weights }, filters: { ...S.settings.filters },
    cutoff: st.cutoff, historyCount: st.L, seed: res.seed, counts: res.counts, ms: Math.round(performance.now() - t0), tickets, metrics: L.portfolioMetrics(st, tickets), dataNote: genState.dataNote };

    <div class="panel section"><p>${esc(genState.phase)}</p><div class="progress"><i id="genBar"></i></div><p class="small muted" id="genCount"></p></div>`;
  const run = S.runs.find(r => r.id === viewArg) || [...S.runs].reverse().find(r => r.game === S.game);
  if (!run) return `${back}<h1>No tickets yet</h1><p class="muted">Press Generate on the home screen to build your first set.</p>`;
  const gm = G[run.game], m = run.metrics, c = run.counts;
  return `${back}
  <div class="row" style="justify-content:space-between;align-items:flex-end">
    <div><h1>Your 5 ${esc(gm.name)} tickets</h1><p class="muted">For ${fmtDate(run.target, true)} · engine ${esc(run.version)} · data through ${fmtDate(run.cutoff)}</p></div>
    <div class="row"><button class="btn primary" id="shotBtn">Screenshot view</button><button class="btn" id="newBtn">Generate a new set</button></div>

  ${run.dataNote ? `<p class="note">${esc(run.dataNote)}</p>` : ''}
  <div class="panel section">
    ${run.tickets.map((t, i) => `<div class="ticket">
      <div class="lbl">Ticket ${i + 1}<b>${esc(t.profile)}</b></div>
      <div>${ballsHTML(t.nums, t.special, { game: run.game })}
        <details><summary>Engine score ${t.score.toFixed(0)} · higher than ${t.pct.toFixed(0)}% of random tickets · why</summary><ul>
          <li>${esc(t.profileDesc)}</li>${t.reasons.map(r => `<li>${esc(r)}</li>`).join('')}<li>${esc(t.specialWhy)}</li></ul></details></div>
      <div class="grade ${t.grade}" title="Grade">${t.grade}</div></div>`).join('')}

  <div class="row section"><button class="btn" id="boughtBtn">I bought these tickets</button><span class="small muted">Saves them to My Tickets so they’re checked automatically after the drawing.</span></div>

      <dt>Low/mid/high patterns</dt><dd>${m.lmh} different</dd>
      <dt>Gap patterns</dt><dd>${m.gapPatterns} different</dd>
      <dt>${esc(gm.special)}s</dt><dd>${m.specials} different</dd>
      <dt>Average score</dt><dd>${(run.tickets.reduce((a, t) => a + t.score, 0) / 5).toFixed(1)}</dd></dl></div>
    <div class="panel"><h3>Candidates evaluated</h3><dl class="kv small" style="margin-top:8px">
      <dt>Evaluated</dt><dd>${c.evaluated.toLocaleString()} unique (${c.duplicates.toLocaleString()} duplicates skipped)</dd>
      <dt>Passed structural filter</dt><dd>${c.passStructural.toLocaleString()}</dd>
      <dt>Passed momentum filter</dt><dd>${c.passMomentum.toLocaleString()}</dd>
      <dt>Passed relationship filter</dt><dd>${c.passRelationship.toLocaleString()}</dd>
      <dt>Qualified (all three)</dt><dd>${c.qualified.toLocaleString()}</dd>

vPicks.after = () => {
  const run = S.runs.find(r => r.id === viewArg) || [...S.runs].reverse().find(r => r.game === S.game); if (!run) return;
  $('#shotBtn') && ($('#shotBtn').onclick = () => showShot(run));
  $('#newBtn') && ($('#newBtn').onclick = () => { S.game = run.game; runGenerate(); });
  $('#boughtBtn') && ($('#boughtBtn').onclick = () => boughtDialog(run));
};
function showShot(run) {
  const gm = G[run.game]; const layer = $('#layer');
  layer.innerHTML = `<div class="overlay" role="dialog" aria-label="Tickets for screenshot"><div class="shot">
    <div class="row noprint" style="justify-content:space-between;margin-bottom:10px"><button class="btn" id="closeShot">Close</button><button class="btn" id="printShot">Print</button></div>

    ${run.tickets.map((t, i) => `<div class="t"><span class="n">${i + 1}</span>${ballsHTML(t.nums, t.special, { size: 'lg', game: run.game })}</div>`).join('')}
    <p class="faint small" style="margin-top:14px">Lottery Intelligence Engine ${esc(run.version)} · data through ${fmtDate(run.cutoff)} · selections do not change the odds.</p></div></div>`;

function boughtDialog(run) {
  const g = run.game, era = L.eraFor(g, run.target);
  modal(`<h2>Save as purchased</h2><p class="muted small">Tickets for ${fmtDate(run.target, true)}. Add-ons change the cost and how prizes are calculated.</p>
    <div class="opts">${era.multiplier === 'powerplay' ? `<label><input type="checkbox" id="bPP"> Power Play (+$1 per play)</label><label><input type="checkbox" id="bDP"> Double Play (+$1 per play)</label>` :
      `<p class="small muted">Mega Millions prints a random multiplier (2×–10×) next to each play. You can add it later in My Tickets so prizes can be calculated.</p>`}</div>
    <label for="bCount">How many of the 5 did you buy?</label><select id="bCount">${[5, 4, 3, 2, 1].map(n => `<option value="${n}">${n === 5 ? 'All 5' : 'Tickets 1–' + n}</option>`).join('')}</select>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="bSave">Save tickets</button><button class="btn quiet" data-close>Cancel</button></div>`);

    evaluateTicket(t); checkTicket(t); S.tickets.push(t); audit('ticket', `Saved ${plays.length} engine play(s) for ${G[g].name} ${run.target}.`); save(); closeModal(); toast('Saved to My Tickets.'); go('tickets');

}
function modal(html) {
  $('#layer').innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div class="sheet">${html}</div></div>`;
  $('#layer .modal').addEventListener('click', e => { if (e.target.classList.contains('modal') || e.target.hasAttribute('data-close')) closeModal(); });
}
function closeModal() { $('#layer').innerHTML = ''; }

// ------------------------------------------------------------ TICKETS
function statusText(t) {
  const r = t.result || {};
  if (t.verifiedPrize != null) return `<b>${money(t.verifiedPrize, 2)}</b> verified`;
  if (r.status === 'awaiting') return 'Awaiting drawing';
  if (r.status === 'missing') return '<span style="color:var(--warn)">Result not yet retrieved</span>';
  if (r.status === 'pending') return `${r.amount ? '<b>' + money(r.amount) + '</b> + ' : ''}<span style="color:var(--warn)">pending verification</span>`;
  if (r.status === 'checked') return r.amount > 0 ? `<b style="color:var(--good)">Won ${money(r.amount)}</b> (calculated)` : 'No prize';
  return '';
}
function vTickets() {
  const g = S.game; const list = S.tickets.filter(t => t.game === g && !t.deleted).sort((a, b) => b.drawDate.localeCompare(a.drawDate) || b.created.localeCompare(a.created));
  return `${back}<div class="row" style="justify-content:space-between"><h1>My ${esc(G[g].name)} tickets</h1><button class="btn primary" data-nav="scan">Add a ticket</button></div>
  ${list.length ? `<div class="panel section">${list.map(t => {
    const d = draws(g).find(r => r.d === t.drawDate);
    return `<div class="ticket" style="cursor:pointer" data-tid="${t.id}">
      <div class="lbl">${fmtDate(t.drawDate)}<b>${esc(srcName(t.source))}</b></div>
      <div>${t.plays.map((p, i) => `<div style="margin:3px 0">${ballsHTML(p.w, p.b, { size: 'sm', game: g, hit: d ? d.w : [], hitB: d && d.b === p.b })}${t.eval ? ` <span class="small muted">${t.eval.plays[i].score.toFixed(0)}</span>` : ''}</div>`).join('')}
        <div class="small muted">${statusText(t)} · ${money(t.cost)} · ${esc(entryName(t.entry))}</div></div>
      <div class="grade ${t.eval ? t.eval.plays[0].grade : ''}">${t.eval ? t.eval.plays[0].grade : '–'}</div></div>`; }).join('')}</div>` :
    `<div class="panel section"><p>No ${esc(G[g].name)} tickets saved yet.</p><p class="muted small">After you buy tickets, photograph them or type them in. They’ll be checked automatically once results are published.</p></div>`}`;
}
vTickets.after = app => app.querySelectorAll('[data-tid]').forEach(el => el.onclick = () => ticketDetail(el.dataset.tid));
function ticketDetail(id) {
  const t = S.tickets.find(x => x.id === id); if (!t) return; const g = t.game, gm = G[g], era = L.eraFor(g, t.drawDate);
  const d = draws(g).find(r => r.d === t.drawDate); const photo = t.photo ? photoGet(t.photo) : null;
  const runs = S.runs.filter(r => r.game === g && r.target === t.drawDate);
  modal(`<div class="row" style="justify-content:space-between"><h2>${esc(gm.name)} · ${fmtDate(t.drawDate, true)}</h2><button class="btn quiet" data-close>Close</button></div>
    <p class="small muted">Numbers chosen by: <b>${esc(srcName(t.source))}</b> · Entered: ${esc(entryName(t.entry))} · Cost ${money(t.cost, 2)}${t.opts.powerPlay ? ' · Power Play' : ''}${t.opts.doublePlay ? ' · Double Play' : ''}${t.opts.megaplier ? ' · Megaplier' : ''}</p>
    ${d ? `<p class="small">Winning numbers: ${ballsHTML(d.w, d.b, { size: 'sm', game: g })} ${d.m ? `<span class="muted">${g === 'pb' ? 'Power Play' : 'Megaplier'} ${d.m}×</span>` : ''}</p>` : `<p class="small muted">${t.result && t.result.status === 'missing' ? 'This drawing has happened but its result hasn’t been retrieved yet.' : 'Drawing hasn’t happened yet.'}</p>`}
    ${t.plays.map((p, i) => { const e = t.eval && t.eval.plays[i]; const r = t.result && t.result.plays && t.result.plays[i];
      return `<div class="panel" style="margin-top:10px"><div class="row" style="justify-content:space-between">${ballsHTML(p.w, p.b, { game: g, hit: d ? d.w : [], hitB: d && d.b === p.b })}${e ? `<div class="grade ${e.grade}">${e.grade}</div>` : ''}</div>
        ${era.multiplier === 'builtin' ? `<label>Multiplier printed on this play</label><select data-mult="${i}"><option value="">Not entered</option>${[2, 3, 4, 5, 10].map(m => `<option ${p.mult === m ? 'selected' : ''} value="${m}">${m}×</option>`).join('')}</select>` : ''}
        ${r ? `<ul class="small" style="padding-left:18px;margin:8px 0">${r.lines.map(l => `<li>${esc(l.label)}${l.amount != null ? ': <b>' + money(l.amount) + '</b>' : ''}</li>`).join('')}</ul>` : ''}
        ${e ? `<dl class="kv small" style="margin-top:8px"><dt>Engine score</dt><dd>${e.score.toFixed(1)} — higher than ${e.pct.toFixed(0)}% of random tickets</dd>
          <dt>Momentum</dt><dd>${e.momentum.toFixed(0)}</dd><dt>Structural</dt><dd>${e.structural.toFixed(0)}</dd><dt>Relationships</dt><dd>${e.relationship.toFixed(0)}</dd>
          <dt>Historical</dt><dd>${e.historical.toFixed(0)}</dd><dt>Gap distribution</dt><dd>${e.gapScore.toFixed(0)}</dd><dt>Number range</dt><dd>${e.rangeScore.toFixed(0)}</dd>
          ${e.specialScore != null ? `<dt>${esc(gm.special)}</dt><dd>${e.specialScore.toFixed(0)}</dd>` : ''}
          <dt>Portfolio fit</dt><dd>${e.compat != null ? e.compat + ' (100 = shares no numbers with the engine’s set)' : 'No engine set for this drawing'}</dd>
          <dt>Profile</dt><dd>${esc(e.profile)} — ${e.profilePct.toFixed(1)}% of past drawings</dd></dl>
          <details><summary>Why</summary><ul>${e.reasons.map(x => `<li>${esc(x)}</li>`).join('')}</ul></details>` : ''}</div>`; }).join('')}
    ${t.eval ? `<p class="small muted" style="margin-top:10px">Scored by engine ${esc(t.eval.version)} using only drawings through ${fmtDate(t.eval.cutoff)}.${t.eval.engineAvg != null ? ` The engine’s own set for this drawing averaged ${t.eval.engineAvg.toFixed(1)}.` : ''}</p>` : ''}
    ${photo ? `<details><summary>Original photo</summary><img src="${photo}" alt="Ticket photo" style="max-width:100%;border-radius:10px;margin-top:8px"></details>` : ''}
    <label for="vPrize">Prize confirmed by the lottery (optional)</label>
    <div class="row"><input type="number" step="0.01" min="0" id="vPrize" style="max-width:180px" value="${t.verifiedPrize ?? ''}" placeholder="e.g. 4.00"><button class="btn" id="vSave">Save</button></div>
    <div class="row" style="margin-top:16px"><button class="btn quiet" id="tDel" style="color:var(--bad)">Remove ticket</button></div>`);
  document.querySelectorAll('[data-mult]').forEach(s => s.onchange = () => { const v = s.value ? +s.value : null; t.plays[+s.dataset.mult].mult = v; checkTicket(t); audit('ticket', `Multiplier ${v || 'cleared'} recorded for a ${gm.name} ${t.drawDate} play.`); save(); ticketDetail(id); });
  $('#vSave').onclick = () => { const v = $('#vPrize').value; const old = t.verifiedPrize; t.verifiedPrize = v === '' ? null : +v; audit('ticket', `Verified prize for ${gm.name} ${t.drawDate} ticket set to ${v === '' ? 'none' : '$' + v} (was ${old ?? 'none'}).`); save(); toast('Saved.'); ticketDetail(id); render(); };
  $('#tDel').onclick = () => { if (!confirm('Remove this ticket? It stays in your backup history but leaves all totals.')) return; t.deleted = new Date().toISOString(); audit('ticket', `Removed ${gm.name} ${t.drawDate} ticket.`); save(); closeModal(); render(); };
}

// ------------------------------------------------------------ SCAN / ADD
let scanDraft = null;
function newDraft() { const g = S.game; return { game: g, drawDate: L.nextDrawDate(g), plays: [{ w: ['', '', '', '', ''], b: '', mult: '' }], opts: { powerPlay: false, doublePlay: false, megaplier: false }, cost: null, entry: 'manual', source: null, photo: null, origin: '', note: '' }; }
function vScan() {
  if (!scanDraft || scanDraft.game !== S.game) scanDraft = newDraft();
  const d = scanDraft, g = d.game, gm = G[g], era = L.eraFor(g, d.drawDate || L.nextDrawDate(g));
  const dates = [...new Set([...upcomingDates(g, 6), ...recentDates(g, 12), ...(/^\d{4}-\d{2}-\d{2}$/.test(d.drawDate) && L.isDrawDay(g, d.drawDate) ? [d.drawDate] : [])])].sort().reverse();
  const engineTickets = S.runs.filter(r => r.game === g).slice(-10).reverse().flatMap(r => r.tickets.map((t, i) => ({ id: r.id + ':' + i, label: `${fmtDate(r.target)} #${i + 1}: ${t.nums.map(p2).join(' ')} + ${p2(t.special)}` })));
  const cost = d.cost != null ? d.cost : L.ticketCost(g, d.drawDate, d.plays.length, d.opts);
  return `${back}<h1>Add a purchased ${esc(gm.name)} ticket</h1>
  <div class="panel section"><h3>1. Photo (optional)</h3>
    <p class="small muted">The photo is kept with the ticket. ${'<span id="ocrNote">Checking whether photo reading is available…</span>'}</p>
    <div class="row"><input type="file" accept="image/*" id="photoIn"><button class="btn" id="readBtn" disabled>Read numbers from photo</button></div>
    <div id="ocrOut" class="small muted"></div>${d.photo ? `<img src="${d.photo}" alt="Ticket photo" style="max-width:220px;border-radius:8px;margin-top:8px">` : ''}</div>
  <div class="panel"><h3>2. Check the details</h3>
    <label for="sDate">Drawing date</label><select id="sDate">${dates.map(x => `<option ${x === d.drawDate ? 'selected' : ''} value="${x}">${fmtDate(x, true)}${x >= L.nextDrawDate(g) ? ' (upcoming)' : ''}</option>`).join('')}</select>
    ${d.plays.map((p, i) => `<label>Play ${String.fromCharCode(65 + i)}</label><div class="row nums">${p.w.map((n, j) => `<input type="number" inputmode="numeric" min="1" max="${era.wMax}" aria-label="Play ${i + 1} white ball ${j + 1}" data-p="${i}" data-j="${j}" value="${n}">`).join('')}
      <input type="number" inputmode="numeric" min="1" max="${era.bMax}" aria-label="Play ${i + 1} ${esc(gm.special)}" data-p="${i}" data-j="b" value="${p.b}" style="border-color:var(--accent)">
      ${era.multiplier === 'builtin' ? `<select data-p="${i}" data-j="m" aria-label="Multiplier" style="width:auto">${['', 2, 3, 4, 5, 10].map(m => `<option value="${m}" ${String(p.mult) === String(m) ? 'selected' : ''}>${m ? m + '×' : 'Mult.'}</option>`).join('')}</select>` : ''}
      ${d.plays.length > 1 ? `<button class="btn quiet" data-rm="${i}" aria-label="Remove play">✕</button>` : ''}</div>`).join('')}
    <div class="row" style="margin-top:8px"><button class="btn" id="addPlay">Add another play</button></div>
    <div class="opts">${era.multiplier === 'powerplay' ? `<label><input type="checkbox" id="oPP" ${d.opts.powerPlay ? 'checked' : ''}> Power Play</label><label><input type="checkbox" id="oDP" ${d.opts.doublePlay ? 'checked' : ''}> Double Play</label>` : ''}
      ${era.multiplier === 'megaplier' ? `<label><input type="checkbox" id="oMP" ${d.opts.megaplier ? 'checked' : ''}> Megaplier</label>` : ''}</div>
    <label for="sCost">Ticket cost</label><input type="number" step="0.01" id="sCost" value="${cost}" style="max-width:140px"></div>
  <div class="panel"><h3>3. How were these numbers selected?</h3>
    <div class="opts" role="radiogroup">${SOURCES.map(([k, n]) => `<label><input type="radio" name="src" value="${k}" ${d.source === k ? 'checked' : ''}> ${esc(n)}</label>`).join('')}</div>
    <div id="originBox" class="${d.source === 'engine_modified' ? '' : 'hidden'}"><label for="sOrigin">Which engine ticket did you change?</label>
      <select id="sOrigin"><option value="">Choose…</option>${engineTickets.map(t => `<option value="${t.id}" ${d.origin === t.id ? 'selected' : ''}>${esc(t.label)}</option>`).join('')}</select></div>
    <label>How it was entered</label><div class="opts">${ENTRY.map(([k, n]) => `<label><input type="radio" name="entry" value="${k}" ${d.entry === k ? 'checked' : ''}> ${esc(n)}</label>`).join('')}</div>
  </div>
  <div class="row section"><button class="go" id="saveTicket" style="max-width:420px">Save ticket</button></div><p id="saveErr" class="small" style="color:var(--bad)"></p>`;
}
vScan.after = () => {
  const d = scanDraft, g = d.game;
  const sync = () => {
    document.querySelectorAll('[data-p]').forEach(el => { const p = d.plays[+el.dataset.p]; const j = el.dataset.j;
      if (j === 'b') p.b = el.value; else if (j === 'm') p.mult = el.value; else p.w[+j] = el.value; });
    d.drawDate = $('#sDate').value; d.opts.powerPlay = !!($('#oPP') && $('#oPP').checked); d.opts.doublePlay = !!($('#oDP') && $('#oDP').checked); d.opts.megaplier = !!($('#oMP') && $('#oMP').checked);
    const s = document.querySelector('[name=src]:checked'); d.source = s ? s.value : null; const en = document.querySelector('[name=entry]:checked'); d.entry = en ? en.value : d.entry;
    d.origin = $('#sOrigin') ? $('#sOrigin').value : '';
  };
  const recost = () => { sync(); d.cost = null; $('#sCost').value = L.ticketCost(g, d.drawDate, d.plays.length, d.opts); };
  ['#oPP', '#oDP', '#oMP'].forEach(s => $(s) && ($(s).onchange = recost));
  $('#sDate').onchange = () => { sync(); d.cost = null; render(); };
  $('#sCost').onchange = () => { d.cost = Math.max(0, +$('#sCost').value || 0); };
  document.querySelectorAll('[name=src]').forEach(r => r.onchange = () => { sync(); $('#originBox').classList.toggle('hidden', d.source !== 'engine_modified'); });
  $('#addPlay').onclick = () => { sync(); d.plays.push({ w: ['', '', '', '', ''], b: '', mult: '' }); d.cost = null; render(); };
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { sync(); d.plays.splice(+b.dataset.rm, 1); d.cost = null; render(); });
  $('#photoIn').onchange = async e => {
    const f = e.target.files[0]; if (!f) return; sync();
    d.photo = await shrink(f); d.photoBlob = d.photo ? dataUrlBlob(d.photo) : f; d.photoFile = f; if (d.entry === 'manual') d.entry = 'photo_scan'; render();
  };
  setupOCR();
  $('#saveTicket').onclick = async () => {
    sync(); const err = [];
    const era = L.eraFor(g, d.drawDate);
    const plays = d.plays.map((p, i) => {
      const w = p.w.map(x => parseInt(x, 10)); const b = parseInt(p.b, 10);
      if (w.some(x => !Number.isInteger(x) || x < 1 || x > era.wMax)) err.push(`Play ${String.fromCharCode(65 + i)}: white balls must be 1–${era.wMax}.`);
      else if (new Set(w).size !== 5) err.push(`Play ${String.fromCharCode(65 + i)}: white balls can’t repeat.`);
      if (!Number.isInteger(b) || b < 1 || b > era.bMax) err.push(`Play ${String.fromCharCode(65 + i)}: ${G[g].special} must be 1–${era.bMax}.`);
      return { w: w.slice().sort((a, b2) => a - b2), b, mult: p.mult ? +p.mult : null };
    });
    if (!d.source) err.push('Choose how the numbers were selected.');
    if (d.source === 'engine_modified' && !d.origin) err.push('Choose which engine ticket you changed.');
    if (err.length) { $('#saveErr').innerHTML = err.map(esc).join('<br>'); return; }
    const cost = d.cost != null ? d.cost : L.ticketCost(g, d.drawDate, plays.length, d.opts);
    const t = { id: uid(), game: g, drawDate: d.drawDate, plays, opts: { ...d.opts }, cost, entry: d.entry, source: d.source,
      origin: d.origin || null, created: new Date().toISOString(), status: 'purchased' };

  const g = S.game, v = activeVersion(); if (!btForm || btForm.game !== g) btForm = { game: g, tests: 100, pool: 20000, sims: 300, weights: { ...v.weights } };
  const last = [...S.backtests].reverse().find(b => b.game === g);
  return `${back}<h1>${esc(G[g].name)} backtesting</h1>
  <p class="muted">Blind replay: for each past drawing the engine sees only earlier results, builds five tickets, then the real result is revealed and scored. The same drawings are played by thousands of random Quick Pick and birthday-number players for comparison.</p>
  <div class="panel section"><div class="grid2">
    <div><label for="bt1">Drawings to replay</label><select id="bt1">${[50, 100, 200, 400].map(n => `<option ${btForm.tests === n ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
    <div><label for="bt2">Candidates per drawing</label><select id="bt2">${[5000, 20000, 50000].map(n => `<option value="${n}" ${btForm.pool === n ? 'selected' : ''}>${n.toLocaleString()}</option>`).join('')}</select></div>
    <div><label for="bt3">Random players simulated</label><select id="bt3">${[100, 300, 1000].map(n => `<option ${btForm.sims === n ? 'selected' : ''}>${n}</option>`).join('')}</select></div></div>
    <details><summary>Try different weights (research)</summary>${Object.keys(L.DEFAULT_WEIGHTS).map(k => `<label>${esc(L.WEIGHT_LABELS[k])}</label><input type="number" min="0" max="100" data-w="${k}" value="${btForm.weights[k]}" style="max-width:120px">`).join('')}
      <p class="small faint">Weights are normalized, so they don’t need to add to 100.</p></details>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="btGo" ${btRunning ? 'disabled' : ''}>Run backtest</button><span class="small muted">Takes about 10–60 seconds.</span></div>
    ${btRunning ? `<div class="progress" style="margin-top:12px"><i id="btBar"></i></div>` : ''}</div>
  ${last ? btResult(last) : ''}`;
}
function btResult(b) {
  const r = b.r, gm = G[b.game]; const sig = r.pPrize < 0.05 || r.pWm < 0.05;
  const changed = JSON.stringify(b.weights) !== JSON.stringify(activeVersion().weights);
  return `<div class="panel section"><h3>Results: ${r.tests} drawings, ${fmtDate(r.from)} to ${fmtDate(r.to)}</h3>
    <p class="small muted">Weights ${Object.values(b.weights).join('/')} · ${r.pool.toLocaleString()} candidates per drawing · ${r.sims} simulated random players · prizes at base amounts, no multipliers, jackpot counted separately · run ${fmtTime(b.t)}</p>
    <div class="scroll"><table><thead><tr><th>Strategy (5 tickets each drawing)</th><th>Prizes</th><th>Cost</th><th>ROI</th><th>Avg white matches</th><th>${esc(gm.specialShort)} hit %</th><th>Winning tickets %</th></tr></thead><tbody>
      <tr><td><b>Engine</b></td><td>${money(r.engine.prize)}</td><td>${money(r.engine.cost)}</td><td>${r.engine.roi.toFixed(1)}%</td><td>${r.engine.avgWm.toFixed(3)}</td><td>${r.engine.bmRate.toFixed(1)}</td><td>${r.engine.winRate.toFixed(1)}</td></tr>
      <tr><td>Random Quick Picks (average)</td><td>${money(r.random.prize.mean)}</td><td>${money(r.engine.cost)}</td><td>${r.random.roi.toFixed(1)}%</td><td>${r.random.wm.mean.toFixed(3)}</td><td>—</td><td>—</td></tr>
      <tr><td class="small muted">Random, middle 90% of players</td><td class="small muted">${money(r.random.prize.p5)}–${money(r.random.prize.p95)}</td><td></td><td></td><td class="small muted">${r.random.wm.p5.toFixed(3)}–${r.random.wm.p95.toFixed(3)}</td><td></td><td></td></tr>
      <tr><td>Birthday numbers 1–31 (average)</td><td>${money(r.birthday.prize.mean)}</td><td>${money(r.engine.cost)}</td><td>${r.birthday.roi.toFixed(1)}%</td><td>${r.birthday.wm.mean.toFixed(3)}</td><td>—</td><td>—</td></tr>
      <tr><td>Fixed numbers (first set, never changed)</td><td>${money(r.fixed.prize)}</td><td>${money(r.fixed.cost)}</td><td>${r.fixed.roi.toFixed(1)}%</td><td>${r.fixed.avgWm.toFixed(3)}</td><td>${r.fixed.bmRate.toFixed(1)}</td><td>${r.fixed.winRate.toFixed(1)}</td></tr>
    </tbody></table></div>
    <dl class="kv small" style="margin-top:10px"><dt>Expected white matches per ticket by pure chance</dt><dd>${r.expectedWm.toFixed(3)}</dd>
      <dt>Share of random players who did at least as well as the engine (prizes)</dt><dd>${(100 * r.pPrize).toFixed(0)}%</dd>
      <dt>Same, for white-ball matches</dt><dd>${(100 * r.pWm).toFixed(0)}%</dd>
      <dt>Neighborhood proximity (research only)</dt><dd>${r.engine.near.toFixed(2)} numbers per ticket one away from a winner — not a prize and not a sign of better odds</dd>
      <dt>Structural similarity to winning draws</dt><dd>${r.engine.sim.toFixed(0)}% of profile features matched</dd></dl>
    <p class="note" style="margin-top:12px">${sig ? 'Fewer than 5% of random players matched the engine on at least one measure. With several measures and repeated runs, chance alone produces results like this regularly. Treat it as a lead to re-test on future drawings the engine hasn’t seen, not as proof.' : 'The engine’s results fall within the normal range of random play. This is the expected outcome for a fair lottery: no evidence that the engine improves winning chances.'}</p>
    ${changed ? `<div class="row" style="margin-top:10px"><button class="btn" id="propose">Propose these weights as a new engine version</button></div>` : ''}</div>`;
}
vBacktest.after = () => {
  const rd = () => { btForm.tests = +$('#bt1').value; btForm.pool = +$('#bt2').value; btForm.sims = +$('#bt3').value; document.querySelectorAll('[data-w]').forEach(i => btForm.weights[i.dataset.w] = Math.max(0, +i.value || 0)); };
  ['#bt1', '#bt2', '#bt3'].forEach(s => $(s).onchange = rd); document.querySelectorAll('[data-w]').forEach(i => i.onchange = rd);
  $('#btGo').onclick = async () => {
    rd(); const g = S.game; btRunning = true; render();
    const r = await L.backtest(g, draws(g), { tests: btForm.tests, pool: btForm.pool, sims: btForm.sims, weights: btForm.weights, filters: S.settings.filters, seed: 101 },
      p => { const b = $('#btBar'); if (b) b.style.width = (p * 100).toFixed(0) + '%'; });
    delete r.random.prize.sorted; delete r.random.wm.sorted; delete r.birthday.prize.sorted; delete r.birthday.wm.sorted;
    S.backtests.push({ id: uid(), game: g, t: new Date().toISOString(), weights: { ...btForm.weights }, version: activeVersion().id, r: { ...r, perDraw: undefined } });
    if (S.backtests.length > 40) S.backtests.splice(0, S.backtests.length - 40);
    audit('backtest', `${G[g].name} backtest, ${r.tests} drawings, weights ${Object.values(btForm.weights).join('/')}: engine ${money(r.engine.prize)} vs random average ${money(r.random.prize.mean)}.`);
    btRunning = null; save(); render();
  };
  $('#propose') && ($('#propose').onclick = () => proposeVersion([...S.backtests].reverse().find(b => b.game === S.game)));
};

function cloudText() {
  if (!inClaude) return 'Tickets, history and settings are saved on this device. To move them to another phone or computer, use Export backup, then Import backup there.';

  if (CLOUD.state === 'local') return 'Cloud storage isn’t available in this view, so data is saved in this browser only. Export a backup from Settings.';

}

async function photoData(id) {
  const u = photoGet(id); if (!u) return null; if (u.startsWith('data:')) return u;
  try { const b = await (await fetch(u)).blob(); return await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); }); } catch (e) { return null; }
}

function proposeVersion(bt) {
  const cur = activeVersion(); const w = bt ? bt.weights : { ...cur.weights };
  const parts = cur.id.split('.'); let next = `${parts[0]}.${(+parts[1] || 0) + 1}`; while (S.versions.some(v => v.id === next)) next = `${parts[0]}.${+next.split('.')[1] + 1}`;
  modal(`<h2>Propose engine ${next}</h2>
    <table><thead><tr><th>Measure</th><th>Current (${esc(cur.id)})</th><th>Proposed</th></tr></thead><tbody>${Object.keys(L.DEFAULT_WEIGHTS).map(k => `<tr><td>${esc(L.WEIGHT_LABELS[k])}</td><td>${cur.weights[k]}</td><td><input type="number" min="0" max="100" data-pw="${k}" value="${w[k]}" style="max-width:90px"></td></tr>`).join('')}</tbody></table>
    ${bt ? `<p class="small" style="margin-top:10px">Backtest with these weights (${bt.r.tests} drawings): engine ${money(bt.r.engine.prize)} vs random average ${money(bt.r.random.prize.mean)}; ${(100 * bt.r.pPrize).toFixed(0)}% of random players did at least as well.</p>` : '<p class="small muted" style="margin-top:10px">No backtest attached. Run one in Backtesting with these weights before relying on them.</p>'}
    <label for="pwhy">Reason for the change</label><input type="text" id="pwhy" placeholder="e.g. testing more weight on structure">
    <label class="opts"><input type="checkbox" id="pok"> I understand this changes how new tickets are chosen, not the odds of winning.</label>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="pact">Save and activate</button><button class="btn" id="psave">Save without activating</button><button class="btn quiet" data-close>Cancel</button></div>`);
  const make = (activate) => {
    const nw = {}; document.querySelectorAll('[data-pw]').forEach(i => nw[i.dataset.pw] = Math.max(0, +i.value || 0));
    if (!Object.values(nw).some(x => x > 0)) { toast('At least one weight must be above zero.'); return; }
    if (activate && !$('#pok').checked) { toast('Tick the confirmation box to activate.'); return; }
    const v = { id: next, created: new Date().toISOString(), weights: nw, note: $('#pwhy').value || 'User-proposed weights.', status: 'proposed', backtest: bt ? { id: bt.id, engine: bt.r.engine.prize, random: bt.r.random.prize.mean, p: bt.r.pPrize } : null };
    S.versions.push(v); audit('engine', `Engine ${next} proposed (${Object.values(nw).join('/')}) — ${v.note}`);
    if (activate) { S.versions.forEach(x => { if (x.id === S.active) x.status = 'previous'; }); v.status = 'active'; S.active = next; audit('engine', `Engine ${next} activated by user.`); }
    save(); closeModal(); render();
  };
  $('#pact').onclick = () => make(true); $('#psave').onclick = () => make(false);
}

// ------------------------------------------------------------ start
const h = location.hash.slice(1); if (VIEWS.includes(h)) view = h;
checkAllTickets(); render();
const autoRefresh = () => { if (inClaude) return; refresh('pb').catch(() => {}); refresh('mm').catch(() => {}); };
setTimeout(autoRefresh, 400); setInterval(autoRefresh, 15 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { autoRefresh(); cloudSyncDown(); } });
cloudInit().catch(() => { CLOUD.state = 'local'; render(); });
if (!inClaude) {
  idbLoadAll().then(render).catch(() => {});
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
})();
</script>
